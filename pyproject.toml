[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-scan"
version = "0.2.0"
description = "Full-sweep security scanner — secrets, code vulnerabilities, dependencies and git hygiene in one command. Free, offline, private-repo friendly."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Prajapati" }]
requires-python = ">=3.10"
keywords = ["security", "sast", "secret-scanning", "dependency-audit", "sarif", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
sentinel = "sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/priyanshuprajapati987/sentinel-scan"
Changelog = "https://github.com/priyanshuprajapati987/sentinel-scan/blob/main/CHANGELOG.md"
Issues = "https://github.com/priyanshuprajapati987/sentinel-scan/issues"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
