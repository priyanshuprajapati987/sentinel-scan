# CI — push/PR/manual trigger. Public repo = free Actions minutes.
# Keep timeout-minutes on every job. NOTE: always quote step names that
# contain ':' (YAML mapping crash = 0-jobs instant fail).
name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: pip install pytest ruff pytest-timeout
      - run: python -m pytest -q --timeout=300

  self-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: "Self scan (gate: high)"
        run: sentinel scan . --fail-on high -f json -o sentinel-selfscan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfscan
          path: sentinel-selfscan.json
