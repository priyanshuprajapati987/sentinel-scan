# CI — explicit array trigger (billing fixed 2026-10-08; auto-triggers ON).
# Every job keeps timeout-minutes. If billing breaks again, disable the
# workflow from repo settings instead of letting runs fail (failure mails).
name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: pip install pytest ruff
      - run: python -m pytest -q --timeout=120 || python -m pytest -q

  self-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Self scan (gate: high)
        run: sentinel scan . --fail-on high -f json -o sentinel-selfscan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfscan
          path: sentinel-selfscan.json
